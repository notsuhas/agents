servers:
  ipatool:
    transport: stdio
    command: ipatool
    args:
      - mcp
    targets:
      - claude
      - codex
      - opencode
  rea:
    transport: stdio
    command: npx
    args:
      - --yes
      - rea-agents@6.4.0
      - mcp
    targets:
      - claude
      - codex
      - opencode
  argent:
    transport: stdio
    command: argent
    args:
      - mcp
    env:
      DO_NOT_TRACK: '1'
    targets:
      - claude
      - codex
      - opencode
  upsy:
    transport: streamable-http
    url: https://upsy.ai/connect
    targets:
      - claude
      - codex
      - opencode
  bifrost:
    transport: streamable-http
    url: https://mcp.notsuhas.dev/mcp
    headers:
      Authorization:
        fromEnv: BIFROST_AUTHORIZATION
    targets: []
