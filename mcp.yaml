servers:
  1password:
    transport: stdio
    command: 1password-mcp
    args: []
    targets:
      - claude
      - codex
      - opencode
  firebase:
    transport: stdio
    command: npx
    args:
      - --yes
      - firebase-tools@15.32.1
      - mcp
      - --dir
      - .
    env:
      IS_FIREBASE_MCP: 'true'
    targets:
      - claude
      - codex
      - opencode
  ipatool:
    transport: stdio
    command: ipatool
    args:
      - mcp
    targets:
      - claude
      - codex
      - opencode
  rea:
    transport: stdio
    command: npx
    args:
      - --yes
      - rea-agents@6.4.0
      - mcp
    targets:
      - claude
      - codex
      - opencode
  argent:
    transport: stdio
    command: argent
    args:
      - mcp
    env:
      DO_NOT_TRACK: '1'
    targets:
      - claude
      - codex
      - opencode
  upsy:
    transport: streamable-http
    url: https://upsy.ai/connect
    targets:
      - claude
      - codex
      - opencode
