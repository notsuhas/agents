name: Update upstream skills

on:
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: update-upstream-skills
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/checkout@v4
        with:
          repository: notsuhas/agent-backbone
          ref: main
          path: .backbone-tool
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Build updater
        working-directory: .backbone-tool
        run: |
          npm ci --ignore-scripts
          npm run build
      - name: Update declared upstream packages
        run: |
          printf '%s\n' '.backbone-tool/' >> .git/info/exclude
          printf '%s\n' '.update-summary.md' >> .git/info/exclude
          .backbone-tool/bin/agent-backbone upstream update --all --repository .
          .backbone-tool/bin/agent-backbone validate --repository .
          node scripts/update-runtimes.mjs
          node scripts/update-summary.mjs
      - name: Open or refresh update PR
        uses: peter-evans/create-pull-request@v7
        with:
          branch: automation/upstream-skills
          delete-branch: true
          sign-commits: true
          author: github-actions[bot] <41898282+github-actions[bot]@users.noreply.github.com>
          commit-message: 'chore(agents): update skills and runtime versions'
          title: 'chore(agents): update skills and runtime versions'
          body-path: .update-summary.md
          add-paths: |
            backbone.json
            packages/
            skills/
            runtimes.json
